{% extends "base.html" %}
{% block title %}Confirm Delete - Campus Complaint Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-body text-center">
                <h5 class="card-title mb-3">Delete this complaint?</h5>
                <p class="text-muted">"{{ complaint.title }}"</p>
                <p>This action cannot be undone.</p>
                <form method="POST" action="{{ url_for('delete_complaint', complaint_id=complaint.id) }}">
                    <button type="submit" class="btn btn-danger me-2">Yes, Delete</button>
                    <a href="{{ url_for('complaint_detail', complaint_id=complaint.id) }}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
